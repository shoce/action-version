---
name: "VERSION"
description: "set VERSION env var"
author: "shoce"
inputs: {}
outputs: {}
runs:
  using: "composite"
  steps:
    - shell: bash
      run: |
        TZ='Asia/Bangkok'
        export TZ
        DATE=$(date '+%y.%m%d.%H%M%S')
        echo "TZ [$TZ]"
        echo "DATE [$DATE]"
        VERSION=$( echo "$DATE" | sed -e 's/^[0]*//g' -e 's/[.][0]*/./g' )
        echo "VERSION [$VERSION]"
        echo "VERSION=$VERSION" >> $GITHUB_ENV


